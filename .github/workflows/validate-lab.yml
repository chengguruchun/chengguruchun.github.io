name: Validate Lab

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "index.html"
      - "knowledge.html"
      - "api/knowledge.json"
      - "api/knowledge-criteria.json"
      - "api/knowledge-graph.json"
      - "api/catalog.json"
      - "api/thoughts.json"
      - "api/thoughts-criteria.json"
      - "api/thought-topic.schema.json"
      - "content/thoughts/**"
      - "docs/templates/**"
      - "api/discover.json"
      - "mcp/tools.json"
      - "SKILL.md"
      - "THOUGHT_LOOP.md"
      - "llms.txt"
      - "dist/skills/**"
      - "bench/**"
      - "api/articles.json"
      - "api/diverse-lab.json"
      - "content/index.json"
      - "content/knowledge/**"
      - ".well-known/**"
      - ".github/workflows/validate-lab.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SEO metadata is regenerated
        run: python3 scripts/build_seo.py --check
      - name: Check knowledge registry is regenerated
        run: python3 scripts/build_knowledge.py --check
      - name: Validate knowledge graph structure and provenance
        run: python3 scripts/validate_knowledge_graph.py
      - name: Check Thought Loop indexes are regenerated
        run: python3 scripts/build_thoughts.py --check
      - name: Run validate_lab (no --live)
        run: python3 scripts/validate_lab.py
