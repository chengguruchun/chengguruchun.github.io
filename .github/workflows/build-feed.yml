name: Rebuild feeds

on:
  push:
    paths:
      - "content/**"
      - "api/catalog.json"
      - "api/articles.json"
      - "scripts/build_feeds.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed.xml and api/feeds.json
        run: python3 scripts/build_feeds.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml api/feeds.json
          if git diff --staged --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore: regenerate content RSS feed"
            git push
          fi
