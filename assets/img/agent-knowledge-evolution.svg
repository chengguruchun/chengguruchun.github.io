<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">AI Knowledge Lab：面向 Agent 的自进化知识系统</title>
<desc id="desc">Skill Provider、Knowledge Provider 与 Evolution Engine 协作；Agent Runtime 使用知识执行任务，反馈经过验证和审核后进入 Git 版本化发布，再回流到知识与 Skill。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#f0eee6"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#64748b"/></marker>
  <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#39745d"/></marker>
  <style>
    text{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#202a35}
    .eyebrow{font-size:16px;font-weight:700;letter-spacing:2px;fill:#64748b}
    .title{font-size:38px;font-weight:750}
    .subtitle{font-size:19px;fill:#5c6673}
    .box-title{font-size:23px;font-weight:700}
    .body{font-size:17px;fill:#4d5966}
    .small{font-size:15px;fill:#66717e}
    .panel{fill:#fffefa;stroke:#d9d7cf;stroke-width:2}
    .skill{fill:#edf3ff;stroke:#b8c9ee}
    .knowledge{fill:#eaf4ef;stroke:#b4d5c4}
    .evolution{fill:#fff2df;stroke:#e6c99b}
    .runtime{fill:#263746;stroke:#263746}
    .runtimeText{fill:#fffefa}
    .flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    .feedback{fill:none;stroke:#39745d;stroke-width:3.5;marker-end:url(#greenArrow)}
  </style>
</defs>
<rect width="1440" height="900" rx="28" fill="url(#bg)"/>
<text x="72" y="72" class="eyebrow">AI KNOWLEDGE LAB · AGENT-NATIVE</text>
<text x="72" y="122" class="title">面向 Agent 的自进化知识系统</text>
<text x="72" y="158" class="subtitle">Skill 定义如何做事 · Knowledge 提供依据 · Evolution 从反馈中发现改进</text>

<rect x="72" y="198" width="1296" height="96" rx="18" class="panel"/>
<text x="108" y="238" class="eyebrow">KNOWLEDGE &amp; CAPABILITY SURFACE</text>
<text x="108" y="270" class="box-title">Diverse Lab / AI Knowledge Lab</text>
<text x="860" y="252" class="body">静态内容 + JSON 索引 + Git 版本历史</text>

<path d="M720 294 V326 H278 V350" class="flow"/>
<path d="M720 326 V350" class="flow"/>
<path d="M720 326 H1162 V350" class="flow"/>

<rect x="72" y="350" width="408" height="170" rx="18" class="skill"/>
<text x="104" y="391" class="eyebrow">01 · SKILL PROVIDER</text>
<text x="104" y="429" class="box-title">Skill 提供者</text>
<text x="104" y="463" class="body">任务方法 · 工具编排 · 输出约束</text>
<text x="104" y="491" class="body">评估标准 · 可复用工作流</text>

<rect x="516" y="350" width="408" height="170" rx="18" class="knowledge"/>
<text x="548" y="391" class="eyebrow">02 · KNOWLEDGE PROVIDER</text>
<text x="548" y="429" class="box-title">知识提供者</text>
<text x="548" y="463" class="body">Catalog · Knowledge · Thoughts</text>
<text x="548" y="491" class="body">原文证据 · 知识图谱 · 状态追踪</text>

<rect x="960" y="350" width="408" height="170" rx="18" class="evolution"/>
<text x="992" y="391" class="eyebrow">03 · EVOLUTION ENGINE</text>
<text x="992" y="429" class="box-title">知识进化引擎</text>
<text x="992" y="463" class="body">新资料摄取 · 冲突与缺口识别</text>
<text x="992" y="491" class="body">生成变更候选 · 评估与验证</text>

<path d="M278 520 V554 H720 V582" class="flow"/>
<path d="M720 520 V582" class="flow"/>
<path d="M1164 520 V554 H720" class="flow"/>

<rect x="330" y="582" width="780" height="106" rx="20" class="runtime"/>
<text x="720" y="623" text-anchor="middle" class="eyebrow" fill="#c9d6df">EXECUTION LAYER</text>
<text x="720" y="657" text-anchor="middle" class="box-title runtimeText">Agent Runtime · 外部 Agent · 工具与实验</text>

<path d="M720 688 V722" class="flow"/>
<rect x="330" y="722" width="780" height="92" rx="18" class="panel"/>
<text x="370" y="758" class="box-title">反馈 → 验证 → 审核 → 版本化发布</text>
<text x="370" y="788" class="body">CI 检查结构、引用和一致性；技术结论仍需证据、测试或人工判断</text>

<path d="M1110 768 H1300 V435 H1368" class="feedback"/>
<text x="1184" y="746" class="small" fill="#39745d">反馈与修订</text>
<path d="M330 768 H140 V435 H72" class="feedback"/>
<text x="88" y="746" class="small" fill="#39745d">知识 / Skill 更新</text>

<text x="72" y="864" class="small">目标架构：持续发现知识缺口，提出改进并可追溯地验证；不是让模型无约束地自动改写正式知识。</text>
</svg>