<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="AI Knowledge Lab">
  <title>AI Knowledge Lab</title>
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="8" fill="#f7f5f0" stroke="#c4a35a" stroke-width="1.4"/>

  <!-- article page (left, inset) -->
  <g transform="translate(7,10)">
    <rect x="0" y="0" width="12.5" height="17.5" rx="1.3" fill="#fff" stroke="#1f242b" stroke-width="1.25"/>
    <path d="M2.4 3.6h7.8M2.4 6.5h7.8M2.4 9.4h6.2M2.4 12.3h7M2.4 15.2h4.8" stroke="#1f242b" stroke-width="1.05" stroke-linecap="round" opacity="0.72"/>
  </g>

  <!-- robot: square head, two eyes, antenna, status mouth (right, inset) -->
  <g transform="translate(22.2,11.5)">
    <!-- antenna -->
    <path d="M6.1 2.8V0.6" stroke="#6a9e8a" stroke-width="1.25" stroke-linecap="round"/>
    <circle cx="6.1" cy="0.2" r="1.15" fill="#6a9e8a"/>
    <!-- head -->
    <rect x="0.2" y="2.8" width="11.8" height="10.8" rx="2.1" fill="#f7f5f0" stroke="#1f242b" stroke-width="1.3"/>
    <!-- two eyes -->
    <circle cx="3.9" cy="7.4" r="1.2" fill="#1f242b"/>
    <circle cx="8.3" cy="7.4" r="1.2" fill="#1f242b"/>
    <!-- status / mouth -->
    <rect x="3.2" y="10.7" width="5.8" height="1.3" rx="0.65" fill="#6a9e8a"/>
  </g>

  <!-- reading beams from left eye toward page -->
  <path d="M24.8 18.2 L17.8 18.9" stroke="#c4a35a" stroke-width="1.05" stroke-linecap="round"/>
  <path d="M24.7 16.6 L17.9 16.2" stroke="#c4a35a" stroke-width="0.95" stroke-linecap="round" opacity="0.7"/>
</svg>
