name: Sync Articles index

on:
  push:
    paths:
      - "articles/*.html"
      - "scripts/sync_articles_index.py"
      - ".github/workflows/sync-articles-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync Articles index
        run: python3 scripts/sync_articles_index.py
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/index.html
          if git diff --staged --quiet; then
            echo "Articles index already up to date"
          else
            git commit -m "chore: sync Articles index"
            git push
          fi
