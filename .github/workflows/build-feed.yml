name: Rebuild feeds, Articles index and SEO

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "api/catalog.json"
      - "api/articles.json"
      - "scripts/build_feeds.py"
      - "scripts/build_seo.py"
      - "scripts/sync_articles_index.py"
      - "scripts/validate_lab.py"
      - "scripts/build_knowledge.py"
      - ".github/workflows/build-feed.yml"
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-generated-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One guarded step avoids workflow-level condition ambiguity and prevents
      # the generated commit from recursively regenerating itself.
      - name: Regenerate and validate generated state
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$HEAD_COMMIT_MESSAGE" == "chore: regenerate feeds, Articles index and page metadata" ]]; then
            echo "Generated-state commit; no regeneration needed."
            exit 0
          fi

          python3 scripts/sync_articles_index.py
          python3 scripts/build_feeds.py
          python3 scripts/build_seo.py
          python3 scripts/build_seo.py --check
          python3 scripts/build_knowledge.py
          python3 scripts/build_knowledge.py --check
          python3 scripts/validate_lab.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml api/feeds.json sitemap.xml robots.txt api/knowledge.json api/knowledge-criteria.json api/catalog.json api/articles.json api/diverse-lab.json content/index.json api/tags.json "*.html" articles/index.html
          if git diff --staged --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: regenerate feeds, Articles index and page metadata"
            git push
          fi
