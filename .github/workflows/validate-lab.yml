name: Validate Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SEO metadata is regenerated
        run: python3 scripts/build_seo.py --check
      - name: Run validate_lab (no --live)
        run: python3 scripts/validate_lab.py
