# Weekly Hot Words loop nudge / optional DeepSeek proposal
name: Hot Words Weekly

on:
  schedule:
    # Monday 01:00 UTC = Monday 09:00 Asia/Shanghai
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute period (Asia/Shanghai)
        id: meta
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          week = (now.day - 1) // 7 + 1
          period = f"{now:%Y-%m}-W{week}"
          print(period)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"period={period}\n")
          PY

      - name: Open proposal issue (always)
        uses: actions/github-script@v7
        with:
          script: |
            const period = process.env.PERIOD;
            const title = `[hot-words] propose ${period}`;
            const body = [
              `## Hot Words weekly loop`,
              ``,
              `Period: **${period}**`,
              ``,
              `### Protocol`,
              `1. Read current \`/times/\` + \`content/times/\``,
              `2. Propose 3 candidates with evidence`,
              `3. Pick one word + why (editorial Chinese)`,
              `4. Apply via Pi \`/hot-words\` or:`,
              '   `python3 scripts/hot_words_apply.py --period ... --word ... --why ...`',
              `5. Human review → commit/push`,
              ``,
              `### DeepSeek / Pi`,
              `Local: see \`docs/pi-deepseek/README.md\`.`,
              `Optional repo secret: \`DEEPSEEK_API_KEY\` (not required for this issue).`,
              ``,
              `— automated from hot-words-weekly.yml`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'hot-words',
              per_page: 20,
            }).catch(() => ({ data: [] }));
            const exists = (issues.data || []).some(i => i.title === title);
            if (exists) {
              core.info('Issue already open: ' + title);
              return;
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['hot-words'],
              });
            } catch (e) {
              // label may not exist
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
        env:
          PERIOD: ${{ steps.meta.outputs.period }}

      - name: Optional DeepSeek draft comment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PERIOD: ${{ steps.meta.outputs.period }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          period = os.environ["PERIOD"]
          key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          if not key:
              print("DEEPSEEK_API_KEY not set; skip model draft")
              raise SystemExit(0)
          prompt = (
              f"You are drafting Hot Words candidates for period {period} "
              "for an AI Agent knowledge lab. Return JSON with keys "
              "candidates (array of {word, evidence, notes}) and "
              "chosen ({word, why}) in Chinese editorial tone. One compound word max."
          )
          body = {
              "model": "deepseek-chat",
              "messages": [
                  {"role": "system", "content": "Return compact JSON only."},
                  {"role": "user", "content": prompt},
              ],
              "temperature": 0.7,
          }
          req = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.loads(resp.read().decode())
              text = data["choices"][0]["message"]["content"]
              Path = __import__("pathlib").Path
              Path("hot-words-deepseek-draft.md").write_text(
                  f"# DeepSeek draft for {period}\n\n```json\n{text}\n```\n",
                  encoding="utf-8",
              )
              print("wrote hot-words-deepseek-draft.md")
          except Exception as e:
              print("DeepSeek call skipped/failed:", e)
          PY

      - name: Upload DeepSeek draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: hot-words-deepseek-draft
          path: hot-words-deepseek-draft.md
          if-no-files-found: ignore
