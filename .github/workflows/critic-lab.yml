name: Critic Lab

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "!articles/index.html"
  workflow_dispatch:
    inputs:
      article:
        description: "Optional article path, e.g. articles/domain-driven-agent-tool-design.html"
        required: false
        type: string

concurrency:
  group: critic-lab
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  critic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select changed article
        id: article
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ARTICLE: ${{ inputs.article }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_ARTICLE" ]; then
            ARTICLE="$INPUT_ARTICLE"
          else
            # Prefer real article pages; never review articles/index.html (listing page).
            ARTICLE=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'articles/*.html' \
              | grep -vE '(^|/)index\.html$' \
              | head -n 1 || true)
          fi
          if [ -z "$ARTICLE" ]; then
            echo "No article changed; nothing to critic."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$ARTICLE" ]; then
            echo "Article not found: $ARTICLE"
            exit 1
          fi
          # Defense in depth: reject index even if passed via workflow_dispatch.
          case "$ARTICLE" in
            articles/index.html|*/index.html)
              echo "Refusing to critic listing page: $ARTICLE"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "article=$ARTICLE" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Run Critic Agent
        if: steps.article.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CRITIC_PROVIDER: deepseek
          CRITIC_MODEL: ${{ vars.CRITIC_MODEL || 'deepseek-chat' }}
          ARTICLE_PATH: ${{ steps.article.outputs.article }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p api/critic/runs
          # workflow_dispatch has no before/after push SHAs; fall back to HEAD~1 / HEAD
          BEFORE="${BEFORE_SHA:-}"
          AFTER="${AFTER_SHA:-}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          if [ -z "$AFTER" ]; then
            AFTER=$(git rev-parse HEAD)
          fi
          python3 scripts/critic_lab.py \
            --article "$ARTICLE_PATH" \
            --before "$BEFORE" \
            --after "$AFTER" \
            --output-dir api/critic/runs

      - name: Commit critic report
        if: steps.article.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/critic/runs/
          if git diff --cached --quiet; then
            echo "no critic report change"
            exit 0
          fi
          git commit -m "chore(critic): record article review"
          git push

      - name: Publish critic issue
        if: steps.article.outputs.run == 'true'
        env:
          ARTICLE_PATH: ${{ steps.article.outputs.article }}
          AFTER_SHA: ${{ github.sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const article = process.env.ARTICLE_PATH;
            const slug = path.basename(article, '.html');
            const files = fs.readdirSync('api/critic/runs')
              .filter(f => f.startsWith(`${slug}-`) && f.endsWith('.md'))
              .sort();
            if (!files.length) core.setFailed('Critic markdown report not found');
            const latest = files[files.length - 1];
            const report = fs.readFileSync(path.join('api/critic/runs', latest), 'utf8');
            const title = `[critic] ${slug}`;
            const body = [
              report,
              '',
              '---',
              `Commit: \`${process.env.AFTER_SHA}\``,
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['critic'],
                });
              } catch (e) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            }
