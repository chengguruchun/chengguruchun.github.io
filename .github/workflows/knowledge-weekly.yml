# Weekly knowledge lifecycle: recompute freshness, optional verifier reports, never edit articles.
name: Knowledge Weekly

on:
  schedule:
    # Sunday 02:10 UTC = Sunday 10:10 Asia/Shanghai (after agent-native)
    - cron: "10 2 * * 0"
  workflow_dispatch:
    inputs:
      verify:
        description: "Run model verifier on stale items (needs DEEPSEEK_API_KEY)"
        required: false
        type: boolean
        default: true
      limit:
        description: "Max stale items to verify"
        required: false
        type: string
        default: "3"

concurrency:
  group: knowledge-weekly
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute period
        id: meta
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          week = (now.day - 1) // 7 + 1
          period = f"{now:%Y-%m}-W{week}"
          ts = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          run_id = f"knowledge-{period}-{ts}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"period={period}\n")
              f.write(f"run_id={run_id}\n")
          print(period, run_id)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild registry + write run
        id: check
        env:
          PERIOD: ${{ steps.meta.outputs.period }}
          RUN_ID: ${{ steps.meta.outputs.run_id }}
        run: |
          python3 scripts/build_knowledge.py
          python3 scripts/knowledge_check.py --write
        continue-on-error: true

      - name: Optional verifier reports
        id: verify
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PERIOD: ${{ steps.meta.outputs.period }}
        run: |
          VERIFY="${{ github.event_name == 'schedule' || github.event.inputs.verify == 'true' }}"
          if [ "$VERIFY" != "true" ]; then
            echo "verify skipped"
            exit 0
          fi
          LIMIT="${{ github.event.inputs.limit || '3' }}"
          python3 scripts/knowledge_verify.py --due --limit "$LIMIT"
        continue-on-error: true

      - name: Rebuild after reports
        run: python3 scripts/build_knowledge.py

      - name: Commit registry + run + reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/knowledge.json api/knowledge-criteria.json api/knowledge/ \
            api/catalog.json api/articles.json api/diverse-lab.json content/index.json \
            content/knowledge/reports/
          if git diff --cached --quiet; then
            echo "no knowledge change"
            exit 0
          fi
          git commit -m "chore(knowledge): record run ${{ steps.meta.outputs.run_id }}"
          git push

      - name: Open review issue
        if: steps.check.outputs.needs_issue == 'true' || steps.check.outputs.failed == 'true'
        uses: actions/github-script@v7
        env:
          PERIOD: ${{ steps.meta.outputs.period }}
          RUN_ID: ${{ steps.meta.outputs.run_id }}
          DUE: ${{ steps.check.outputs.due_ids }}
          ERR: ${{ steps.check.outputs.error }}
        with:
          script: |
            const period = process.env.PERIOD || 'unknown';
            const runId = process.env.RUN_ID || '';
            const due = (process.env.DUE || '').split(',').filter(Boolean);
            const err = process.env.ERR || '';
            const title = `[knowledge] review ${period}`;
            const body = [
              '## Knowledge lifecycle weekly check',
              '',
              `Period: **${period}**`,
              runId ? `RunId: **${runId}**` : null,
              runId ? `Manifest: \`/api/knowledge/runs/${runId}.json\`` : null,
              '',
              due.length ? `Due: ${due.map(id => `\`${id}\``).join(', ')}` : 'No due ids.',
              '',
              err ? '```\n' + err + '\n```' : null,
              '',
              'Agent reports (if any) are under `content/knowledge/reports/`.',
              'Do **not** let the report rewrite the article. Human: `python3 scripts/knowledge_review.py --id <id> --decision keep|changed|contested|archived`',
              '',
              `Workflow: knowledge-weekly.yml`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].filter(Boolean).join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            }).catch(() => ({ data: [] }));
            const exists = (issues.data || []).find(i => i.title === title);
            if (exists) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: exists.number,
                body,
              });
              return;
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['knowledge'],
              });
            } catch (e) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
