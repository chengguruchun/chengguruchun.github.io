# Oh My Pi → LiteLLM proxy (multi-model)
# 1) Start LiteLLM: litellm --config litellm.config.yaml --port 4000
# 2) export LITELLM_MASTER_KEY=...  (if set in LiteLLM)
# 3) Copy to ~/.omp/agent/models.yml
providers:
  litellm:
    baseUrl: http://127.0.0.1:4000
    api: openai-completions
    apiKey: LITELLM_MASTER_KEY
    authHeader: true
    models:
      - id: deepseek-v4-flash
        name: DeepSeek Flash (via LiteLLM)
        reasoning: true
        input: [text]
        contextWindow: 128000
        maxTokens: 8192
      - id: deepseek-v4-pro
        name: DeepSeek Pro (via LiteLLM)
        reasoning: true
        input: [text]
        contextWindow: 128000
        maxTokens: 8192
      - id: deepseek-chat
        name: DeepSeek Chat (via LiteLLM)
        input: [text]
        contextWindow: 128000
        maxTokens: 8192
      - id: deepseek-reasoner
        name: DeepSeek Reasoner (via LiteLLM)
        reasoning: true
        input: [text]
        contextWindow: 128000
        maxTokens: 8192
