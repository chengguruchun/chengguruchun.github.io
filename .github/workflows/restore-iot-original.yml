name: Restore original IoT article

on:
  push:
    paths:
      - .github/workflows/restore-iot-original.yml

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[restore-iot-original]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact original files
        run: |
          git fetch origin main
          curl -fsSL https://raw.githubusercontent.com/chengguruchun/chengguruchun.github.io/c677bdbfac5429b2814f4dcb3d31c04bd1180952/articles/iot-agent-from-automation-to-physical-infrastructure.html -o articles/iot-agent-from-automation-to-physical-infrastructure.html
          curl -fsSL https://raw.githubusercontent.com/chengguruchun/chengguruchun.github.io/c677bdbfac5429b2814f4dcb3d31c04bd1180952/articles/index.html -o articles/index.html
          rm -f articles/iot-agent-from-automation-to-physical-infrastructure-part-ii.html
          git rm -f .github/workflows/restore-iot-original.yml
          git config user.name 'chengguruchun'
          git config user.email 'chengguruchun@163.com'
          git add articles/iot-agent-from-automation-to-physical-infrastructure.html articles/index.html
          git commit -m 'Restore original IoT article and remove Part II [restore-iot-original]'
          git push origin HEAD:main
